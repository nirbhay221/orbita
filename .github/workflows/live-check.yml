name: live demo

# The deployed demo, checked twice a day the way a judge uses it. No language model is called and nothing is
# installed: the check is one Node script calling the live server's tools. A failure turns the README's badge red and
# GitHub emails the repository owner.
on:
  schedule:
    - cron: '17 6,18 * * *'
  workflow_dispatch:

jobs:
  live:
    name: the live demo answers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/live-check.mjs
