# systemd drop-in: install as /etc/systemd/system/orbita.service.d/10-hardening.conf
#
# A drop-in rather than a replacement unit because the running instance's unit file
# carries values that are specific to it, ORBITA_PUBLIC_URL and ORBITA_EMAIL_FROM,
# written when it was created. Replacing the unit would quietly lose them, and
# redeploying the app alone never touches the unit at all, so without this an
# existing instance runs the new code under the old settings: no key, auth off,
# looking deployed and behaving exactly as it did before.
#
# Additive and reversible: delete this file, run `systemctl daemon-reload`, and the
# service is back to what it was.

[Service]
# Fetch secrets from SSM into /run/orbita/env. The + runs it with full privileges
# despite the unit's sandboxing, because it has to write /run/orbita. The service
# itself never runs as root.
ExecStartPre=+/usr/local/libexec/orbita-secrets
EnvironmentFile=-/run/orbita/env

# Refuse to start without a data key rather than store farms in the clear.
Environment=ORBITA_REQUIRE_ENCRYPTION=on

# Account linking needs a passphrase, and tokens survive a deploy. The demo page keeps
# working through its own sandbox door, which cannot reach a linked account.
Environment=ORBITA_AUTH=on
Environment=ORBITA_AUTH_DATA=/var/lib/orbita/auth.json

# One hop: API Gateway. Without it every visitor shares the gateway's address and one
# noisy visitor rate-limits everybody. Safe only because the origin secret, once
# armed, means nothing else can reach this process to forge the header.
Environment=ORBITA_TRUST_PROXY=1
