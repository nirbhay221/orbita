# Orbita and Sudor together, with the link between them switched on.
#
#   git clone <orbita> && git clone <sudor>      # side by side
#   cd orbita && docker compose up --build
#
# Orbita is then on http://localhost:8788 and Sudor on http://localhost:8789. A crew member who shares their
# working day from Sudor can be linked on Orbita's crew list, and Orbita asks Sudor, server to server, how
# their day looks. No keys and no accounts are needed; email stays off, and each demo page shows what would
# have been sent.
services:
  sudor:
    build: ../sudor
    ports:
      - "8789:8789"
    volumes:
      - sudor-data:/app/data
    restart: unless-stopped

  orbita:
    build: .
    ports:
      - "8788:8788"
    environment:
      # Where Orbita asks about a crew member's day. Inside the compose network, by service name.
      ORBITA_SUDOR_URL: http://sudor:8789
    volumes:
      - orbita-data:/app/data
    depends_on:
      sudor:
        condition: service_healthy
    restart: unless-stopped

volumes:
  orbita-data:
  sudor-data:
